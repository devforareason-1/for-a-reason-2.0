<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>Page not found — For a Reason</title>
    <meta name="theme-color" content="#F5F0E6">
    <link rel="icon" href="/assets/img/favicon.ico" sizes="any">
    <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
    <style>
        @font-face {
            font-family: 'Inter';
            font-weight: 400 800;
            font-display: swap;
            src: url(/assets/fonts/inter.woff2) format('woff2')
        }

        @font-face {
            font-family: 'JetBrains Mono';
            font-weight: 400 500;
            font-display: swap;
            src: url(/assets/fonts/jbmono.woff2) format('woff2')
        }

        * {
            box-sizing: border-box;
            margin: 0
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: clamp(20px, 6vw, 80px);
            background: #F5F0E6;
            color: #0B0B0B;
            font: 15px/1.6 'JetBrains Mono', monospace
        }

        h1 {
            font: 800 clamp(90px, 26vw, 360px)/.85 'Inter', sans-serif;
            letter-spacing: -.06em
        }

        h1 span {
            color: #FF6A00
        }

        p {
            margin: 28px 0 32px;
            color: #756F64;
            max-width: 34ch
        }

        a {
            display: inline-block;
            align-self: flex-start;
            padding: 14px 26px;
            background: #FF6A00;
            color: #1A2D24;
            border-radius: 999px;
            text-decoration: none;
            font-size: 13px;
            transition: background .3s
        }

        a:hover,
        a:focus-visible {
            background: #A6B8A0;
            color: #0B0B0B;
            outline: 0
        }
    </style>
</head>

<body>
    <h1>404<span>.</span></h1>
    <p>No reason for this page to exist. Let's get you back.</p>
    <a href="/">Back to home →</a>
    <script>
        // Root-relative URLs remain correct for nested missing routes on the host.
        // Local file previews need paths relative to this file instead.
        if (location.protocol === 'file:') {
            document.querySelector('a').href = 'index.html';
            document.querySelectorAll('link[rel="icon"]').forEach(link => {
                link.href = link.getAttribute('href').slice(1);
            });
            const style = document.createElement('style');
            style.textContent = "@font-face{font-family:Inter;src:url(assets/fonts/inter.woff2);font-weight:400 800;font-display:swap}@font-face{font-family:'JetBrains Mono';src:url(assets/fonts/jbmono.woff2);font-weight:400 500;font-display:swap}";
            document.head.append(style);
        }
    </script>
</body>

</html>
